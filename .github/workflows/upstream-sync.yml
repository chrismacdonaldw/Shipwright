name: Upstream sync
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'chrismacdonaldw/Shipwright' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Test proposal guards
        run: python3 -m unittest discover -s .github/scripts -p test_sync_upstream.py
      - name: Verify App configuration
        env:
          APP_ID: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo 'Configure the upstream sync App ID and private key before running sync.' >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose upstream merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/sync_upstream.py
